<div class="searchable-select">
  <div class="input-wrapper" [class.focused]="isOpen()">

    @if (searchable()) {
    <mat-icon class="field-icon">{{icon()}}</mat-icon>
    }

    <input type="text"
           [value]="searchText()"
           [placeholder]="placeholder()"
           [readOnly]="!searchable()"
           autocomplete="off"
           role="combobox"
           aria-autocomplete="list"
           [attr.aria-expanded]="isOpen()"
           (input)="onSearchInput($event)"
           (focus)="openDropdown()"
           (blur)="closeDropdown()" />

    <button type="button"
            class="icon-button"
            aria-label="Toggle options"
            (mousedown)="$event.preventDefault()"
            (click)="toggleDropdown()">

      <mat-icon>
        {{ isOpen() ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}
      </mat-icon>
    </button>

  </div>

  @if (isOpen()) {
  <div class="dropdown-options" role="listbox">

    @if (loading()) {
    <div class="dropdown-message">
      <span class="loading-dot"></span>
      Loading makes...
    </div>
    }
    @else if (filteredItems().length === 0) {
    <div class="empty-state">
      <mat-icon>search_off</mat-icon>
      <span>No matching options found</span>
    </div>
    }
    @else {
    @for (item of filteredItems(); track $index) {
    <div class="dropdown-option"
         role="option"
         tabindex="0"
         [attr.aria-selected]="isSelected(item)"
         (mousedown)="$event.preventDefault()"
         (click)="selectItem(item)"
         (keydown.enter)="selectItem(item)"
         (keydown.space)="selectItem(item); $event.preventDefault()">

      <span class="option-name">
        {{ getDisplayText(item) }}
      </span>

      @if (isSelected(item)) {
      <mat-icon class="selected-icon">check</mat-icon>
      }

    </div>
    }
    }

  </div>
  }
</div>
